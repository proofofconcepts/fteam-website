name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Project Setup
        run: |
          npm install
          npm run build

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          custom_instructions: |
            This is a Next.js 16 + Tailwind CSS v4 static marketing website for Team FM BJJ gym (Cork, Ireland).
            All content lives in src/data/*.ts — never hardcode gym data directly in components.
            File naming is snake_case under src/. Brand colors and fonts are defined via @theme in src/app/globals.css.
            The contact section uses a static WhatsApp link — no form submission or env vars needed.
            Run `npm run build` to verify there are no TypeScript or lint errors before suggesting a change is complete.
          mcp_config: |
            {
              "mcpServers": {
                "playwright": {
                  "command": "npx",
                  "args": [
                    "@playwright/mcp@latest"
                  ]
                }
              }
            }
          allowed_tools: "Bash(npm:*),mcp__playwright__browser_snapshot,mcp__playwright__browser_click,mcp__playwright__browser_navigate,mcp__playwright__browser_fill_form,mcp__playwright__browser_type,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_wait_for,mcp__playwright__browser_evaluate,mcp__playwright__browser_console_messages,mcp__playwright__browser_network_requests"

  claude-pr-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Project Setup
        run: npm install

      - name: Run Claude Code PR Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          custom_instructions: |
            This is a Next.js 16 + Tailwind CSS v4 static marketing website for Team FM BJJ gym (Cork, Ireland).
            All content lives in src/data/*.ts — never hardcode gym data directly in components.
            File naming is snake_case under src/. Brand colors and fonts are defined via @theme in src/app/globals.css.
            Review the PR changes for correctness, adherence to project conventions, and potential issues.
            Run `npm run build` to check for TypeScript or lint errors introduced by the changes.
          allowed_tools: "Bash(npm:*)"
